name: CI

on:
  push:
    branches:
      - main
      - master
      - build/py312
    tags:
      - '*'
  pull_request:
  workflow_dispatch:
    inputs:
      commit_hash:
        type: string
        description: 'The commit hash to checkout'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.commit_hash }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install cross-compilation toolchain for aarch64
        if: matrix.platform.target == 'aarch64'
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Cargo tests
        env:
          PYO3_PYTHON: python
        run: cargo test --lib --locked

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          OPENSSL_NO_ASM: "1"
          OPENSSL_NO_VENDOR: "1"
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.12
          sccache: 'true'
          manylinux: auto
          before-script-linux: |
            # If we're running on rhel centos, install needed packages.
            if command -v yum &> /dev/null; then
                yum update -y && yum install -y perl-core openssl openssl-devel pkgconfig libatomic
               
                # If we're running on i686 we need to symlink libatomic
                # in order to build openssl with -latomic flag.
                if [[ ! -d "/usr/lib64" ]]; then
                    ln -s /usr/lib/libatomic.so.1 /usr/lib/libatomic.so
                fi
            else
                # If we're running on debian-based system.
                apt update -y && apt-get install -y libssl-dev openssl pkg-config 
            fi
      - name: Smoke test wheel
        timeout-minutes: 5
        run: |
          python -m pip install --force-reinstall dist/simpleai_base-*.whl
          python test.py
      - name: Wheel checksums
        working-directory: dist
        run: sha256sum simpleai_base-*.whl > SHA256SUMS
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-py312-linux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.commit_hash }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.platform.target }}

      - name: Cargo tests
        env:
          PYO3_PYTHON: python
        run: cargo test --lib --locked
      
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: "-Csymbol-mangling-version=v0"
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.12
          sccache: 'true'
      - name: Smoke test wheel
        timeout-minutes: 5
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -Path dist -Filter "simpleai_base-*.whl" | Select-Object -First 1
          python -m pip install --force-reinstall $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Wheel checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Filter "simpleai_base-*.whl" |
            ForEach-Object { "$( (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)" } |
            Set-Content -LiteralPath dist/SHA256SUMS -Encoding ascii
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-py312-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        platform:
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.commit_hash }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cargo tests
        env:
          PYO3_PYTHON: python
        run: cargo test --lib --locked
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.12
          sccache: 'true'
      - name: Smoke test wheel
        timeout-minutes: 5
        run: |
          python -m pip install --force-reinstall dist/simpleai_base-*.whl
          python test.py
      - name: Wheel checksums
        working-directory: dist
        run: shasum -a 256 simpleai_base-*.whl > SHA256SUMS
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-py312-macos-${{ matrix.platform.target }}
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, windows, macos]
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*.whl
